<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Rocket body -->
  <g transform="translate(256,256)">
    <!-- Rocket main body -->
    <path d="M0,-160 C40,-160 55,-100 55,-20 L55,60 C55,75 40,90 0,90 C-40,90 -55,75 -55,60 L-55,-20 C-55,-100 -40,-160 0,-160Z" fill="white"/>
    <!-- Nose cone -->
    <path d="M0,-185 C25,-185 45,-155 50,-120 L-50,-120 C-45,-155 -25,-185 0,-185Z" fill="#fbbf24"/>
    <!-- Window -->
    <circle cx="0" cy="-50" r="25" fill="#4f46e5"/>
    <circle cx="0" cy="-50" r="18" fill="#93c5fd"/>
    <!-- Window shine -->
    <ellipse cx="-6" cy="-56" rx="6" ry="8" fill="white" opacity="0.5"/>
    <!-- Body stripe -->
    <rect x="-40" y="20" width="80" height="12" rx="3" fill="#e0e7ff"/>
    <!-- Left fin -->
    <path d="M-55,30 L-90,110 L-55,80Z" fill="#fbbf24"/>
    <!-- Right fin -->
    <path d="M55,30 L90,110 L55,80Z" fill="#fbbf24"/>
    <!-- Center fin (bottom) -->
    <path d="M0,90 L-20,130 L0,115 L20,130Z" fill="#fbbf24"/>
    <!-- Flame -->
    <ellipse cx="0" cy="140" rx="22" ry="35" fill="#f97316"/>
    <ellipse cx="0" cy="145" rx="13" ry="25" fill="#fbbf24"/>
    <ellipse cx="0" cy="150" rx="6" ry="15" fill="white"/>
    <!-- Small stars -->
    <circle cx="-100" cy="-80" r="4" fill="white" opacity="0.7"/>
    <circle cx="110" cy="-60" r="3" fill="white" opacity="0.6"/>
    <circle cx="-80" cy="50" r="3" fill="white" opacity="0.5"/>
    <circle cx="95" cy="30" r="4" fill="white" opacity="0.6"/>
    <circle cx="-110" cy="-20" r="2.5" fill="white" opacity="0.4"/>
    <circle cx="120" cy="-110" r="3" fill="white" opacity="0.5"/>
  </g>
</svg>
