<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港小學排名 2026</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.22/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-base-200">

  <!-- Navbar -->
  <div class="navbar bg-base-100 shadow-md sticky top-0 z-50">
    <div class="flex-1">
      <span class="text-xl font-bold px-4">🏫 香港小學排名 2026</span>
    </div>
    <div class="flex-none">
      <span id="school-count" class="text-sm text-base-content/60 px-4"></span>
    </div>
  </div>

  <!-- Filter Bar -->
  <div class="bg-base-100 border-b p-4">
    <div class="max-w-7xl mx-auto">
      <!-- Mobile filter toggle -->
      <button id="filter-toggle" class="btn btn-sm btn-outline md:hidden mb-2 w-full">
        篩選條件 ▼
      </button>
      <div id="filter-panel" class="hidden md:block">
        <div class="flex flex-wrap gap-4 items-end">
          <!-- Search -->
          <div class="form-control w-full md:w-64">
            <label class="label"><span class="label-text">搜尋學校</span></label>
            <input type="text" id="filter-search" placeholder="學校名稱..." class="input input-bordered input-sm w-full">
          </div>
          <!-- District -->
          <div class="form-control w-full md:w-48">
            <label class="label"><span class="label-text">地區</span></label>
            <div class="dropdown w-full" id="district-dropdown">
              <label tabindex="0" class="btn btn-sm btn-outline w-full justify-between">
                <span id="district-label">全部地區</span> ▼
              </label>
              <div tabindex="0" class="dropdown-content bg-base-100 shadow-lg rounded-box p-2 w-56 max-h-60 overflow-y-auto z-50">
                <div id="district-options"></div>
              </div>
            </div>
          </div>
          <!-- School Net -->
          <div class="form-control w-full md:w-48">
            <label class="label"><span class="label-text">校網</span></label>
            <div class="dropdown w-full" id="net-dropdown">
              <label tabindex="0" class="btn btn-sm btn-outline w-full justify-between">
                <span id="net-label">全部校網</span> ▼
              </label>
              <div tabindex="0" class="dropdown-content bg-base-100 shadow-lg rounded-box p-2 w-56 max-h-60 overflow-y-auto z-50">
                <div id="net-options"></div>
              </div>
            </div>
          </div>
          <!-- Gender -->
          <div class="form-control">
            <label class="label"><span class="label-text">性別</span></label>
            <div class="flex gap-2">
              <label class="label cursor-pointer gap-1">
                <input type="radio" name="gender" value="" class="radio radio-sm" checked>
                <span class="label-text">全部</span>
              </label>
              <label class="label cursor-pointer gap-1">
                <input type="radio" name="gender" value="男女校" class="radio radio-sm">
                <span class="label-text">男女校</span>
              </label>
              <label class="label cursor-pointer gap-1">
                <input type="radio" name="gender" value="男校" class="radio radio-sm">
                <span class="label-text">男校</span>
              </label>
            </div>
          </div>
          <!-- Rating -->
          <div class="form-control">
            <label class="label"><span class="label-text">評級</span></label>
            <div class="flex gap-2 flex-wrap">
              <label class="label cursor-pointer gap-1">
                <input type="radio" name="rating" value="" class="radio radio-sm" checked>
                <span class="label-text">全部</span>
              </label>
              <label class="label cursor-pointer gap-1">
                <input type="radio" name="rating" value="Top" class="radio radio-sm">
                <span class="label-text">Top</span>
              </label>
              <label class="label cursor-pointer gap-1">
                <input type="radio" name="rating" value="High" class="radio radio-sm">
                <span class="label-text">High</span>
              </label>
              <label class="label cursor-pointer gap-1">
                <input type="radio" name="rating" value="Medium" class="radio radio-sm">
                <span class="label-text">Medium</span>
              </label>
              <label class="label cursor-pointer gap-1">
                <input type="radio" name="rating" value="Unrated" class="radio radio-sm">
                <span class="label-text">未評</span>
              </label>
            </div>
          </div>
          <!-- Clear filters -->
          <button id="clear-filters" class="btn btn-sm btn-ghost">清除篩選</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <div class="max-w-7xl mx-auto p-4">
    <!-- Desktop table -->
    <div class="hidden md:block overflow-x-auto">
      <table class="table table-zebra w-full" id="school-table">
        <thead>
          <tr>
            <th class="w-8"></th>
            <th>排名</th>
            <th>學校名稱</th>
            <th>性別</th>
            <th>地區 / 校網</th>
            <th>評級</th>
            <th>學費</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="school-tbody"></tbody>
      </table>
    </div>

    <!-- Mobile card list -->
    <div class="md:hidden" id="school-cards"></div>
  </div>

  <!-- Compare bar (fixed bottom) -->
  <div id="compare-bar" class="fixed bottom-0 left-0 right-0 bg-base-100 border-t shadow-lg p-3 z-50 hidden">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <span id="compare-count" class="text-sm">已選擇 0 所學校</span>
      <div class="flex gap-2">
        <button id="compare-btn" class="btn btn-primary btn-sm" disabled>比較</button>
        <button id="compare-clear" class="btn btn-ghost btn-sm">取消</button>
      </div>
    </div>
  </div>

  <!-- Compare modal -->
  <dialog id="compare-modal" class="modal">
    <div class="modal-box max-w-6xl w-11/12">
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
      </form>
      <h3 class="text-lg font-bold mb-4">學校比較</h3>
      <div id="compare-content"></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <!-- Detail modal (mobile) -->
  <dialog id="detail-modal" class="modal">
    <div class="modal-box w-11/12 max-w-3xl">
      <form method="dialog">
        <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
      </form>
      <div id="detail-modal-content"></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
